name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0 or 1.0.0-beta.1)'
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

env:
  VERSION: ${{ inputs.version }}
  CYPRESS_INSTALL_BINARY: 0

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version (expected e.g. 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # `pnpm install` runs third-party build scripts; do not leave a
          # write-scoped token in .git/config while they do.
          persist-credentials: false

      - name: Ensure tag does not exist
        run: |
          # `ls-remote --exit-code` reports 0 when the tag is there and 2 when
          # it is not; anything else means the query itself failed, which must
          # not be read as "the tag is free".
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" \
            >/dev/null 2>&1 || status=$?
          case "$status" in
            0) echo "::error::Tag v$VERSION already exists"; exit 1 ;;
            2) ;;
            *) echo "::error::Could not query origin for existing tags (exit $status)"; exit 1 ;;
          esac

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint, type-check, test, build, package check
        run: pnpm check

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      - name: Install Cypress binary
        run: pnpm exec cypress install
        env:
          CYPRESS_INSTALL_BINARY: ''
      - name: Browser tests
        run: pnpm test:browser

      - name: Bump version and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$(node -p "require('./package.json').version")" == "$VERSION" ]]; then
            # package.json already carries this version (bumped in the PR);
            # only the tag is missing.
            git tag -a "v$VERSION" -m "Release v$VERSION"
          else
            npm version "$VERSION" -m "Release v%s"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f CHANGELOG.md ]] && grep -Eq "^## \[?v?${VERSION//./\\.}\]?( |$)" CHANGELOG.md; then
            awk -v ver="$VERSION" '
              BEGIN { gsub(/\./, "\\.", ver) }
              /^## / { if (found) exit; if ($0 ~ ("^## \\[?v?" ver "\\]?( |$)")) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md
            gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi

      # `prepack` rebuilds after the bump, so the version baked into the
      # bundle matches the one being published.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_KEY_NPM }}
