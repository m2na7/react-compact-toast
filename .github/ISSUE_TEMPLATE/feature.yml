name: Feature request
description: Suggest something the library should do
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The library aims to stay small, so every addition has to earn its
        bytes. Describing the problem helps more than describing the API.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: The current workaround, if you have one, and why it falls short.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What the call or prop would look like.
      render: tsx
    validations:
      required: false
