coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        target: 85%
        threshold: 1%
  ignore:
    - 'src/**/*.test.ts'
    - 'src/**/*.test.tsx'
    - 'src/**/*.cy.tsx'
    - 'cypress/**/*'
    - 'playground/**/*'
    - 'scripts/**/*'

comment:
  layout: 'header, diff, flags, files, footer'
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  unit:
    paths:
      - src/
    carryforward: true
