pre-commit:
  jobs:
    - name: eslint
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: '*.{ts,tsx,mts,css,md,json,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: type-check
      run: pnpm type-check
    - name: test
      run: pnpm test
