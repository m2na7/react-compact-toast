language: 'en'
early_access: false
reviews:
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/coverage/**'
    - '!**/cypress/screenshots/**'
    - '!**/cypress/videos/**'
    - '!**/cypress/downloads/**'
    - '!**/playground/.next/**'
    - '!**/*.lock'
    - '!**/*.json'
    - '!**/*.svg'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'
    - '!**/LICENSE'
  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: 'Review React and TypeScript code for hook-rule compliance, correct effect dependencies and cleanup, and no `any`. Flag anything that could leave a timer or listener behind, tear under `useSyncExternalStore`, or break in React StrictMode or during hydration. The library supports React 18 and 19, server rendering and the Next.js App Router. Accessibility is a first-class requirement: live regions, keyboard operation, focus management and reduced motion.'
    - path: 'src/core/**/*.ts'
      instructions: 'Focus on core library logic, event handling, and state management. Ensure proper singleton patterns and memory management. Verify proper TypeScript interfaces and type safety. Check for potential race conditions and async handling.'
    - path: 'src/components/**/*.tsx'
      instructions: 'Review React components for proper prop typing and component composition. Ensure proper use of React hooks and lifecycle management. Check for accessibility attributes and semantic HTML. Verify proper CSS class handling and styling patterns.'
    - path: 'src/hooks/**/*.ts'
      instructions: 'Review custom React hooks for proper hook rules compliance. Ensure proper dependency arrays and effect cleanup. Verify proper return types and hook composition.'
    - path: '**/*.test.{ts,tsx}'
      instructions: 'Review test coverage and test quality. Ensure proper mocking and test isolation. Check for edge cases and error scenarios. Verify proper async test handling.'
    - path: '**/*.cy.tsx'
      instructions: 'Review Cypress component tests for proper component interaction testing. Ensure proper test selectors and assertions. Check for proper test data setup and cleanup.'
    - path: 'src/styles.css'
      instructions: 'The stylesheet is part of the public API. Check the cascade tiers: structural rules must stay inside :where() so a single user class overrides them, while the built-in look under [data-rct-styled] must survive a global reset. Verify that every dimension and colour reads a --rct-* custom property with a fallback, that safe-area insets are preserved, and that prefers-reduced-motion and forced-colors are handled.'
    - path: 'tsdown.config.mts'
      instructions: 'Review build configuration for proper bundling and output formats. Ensure proper entry points and external dependencies handling.'
    - path: 'package.json'
      instructions: 'Review dependencies for security vulnerabilities and version compatibility. Ensure proper peer dependencies for React library. Check scripts and build configuration.'
  auto_review:
    enabled: true
    ignore_title_keywords:
      - 'WIP'
      - 'DO NOT MERGE'
      - 'DRAFT'
      - 'work in progress'
      - 'wip'
  drafts: false
  base_branches:
    - 'main'
    - 'develop'
    - 'release/*'
    - 'feat/*'
    - 'fix/*'
chat:
  auto_reply: true
